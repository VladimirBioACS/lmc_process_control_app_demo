<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>{{{payload.style}}}</style>
</head>
<body>
    <header class="top-bar">
        <div class="header-content">
            <span class="material-icons">login</span>
            <h4>Система керування</h4>
        </div>
    </header>

    <div class="login-container">
        <div class="login-box">
            <h2>Вхід в систему</h2>
            <p>Авторизуйтеся для входу</p>
            <form id="loginForm" action="http://signalio:1880/ui" method="get">
                <div class="input-group">
                    <label for="username">Ім'я користувача</label>
                    <input type="text" id="username" name="uname" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="psw" placeholder="*******" required>
                </div>
                <button type="submit" class="login-button">Вхід</button>
            </form>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
